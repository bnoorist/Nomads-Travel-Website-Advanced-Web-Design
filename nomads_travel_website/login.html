<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Nomads</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light fixed-top bg-white shadow-sm" id="mainNav">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="index.html">Nomads</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html">Journal</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="btn btn-outline-dark btn-sm" href="login.html">Login</a></li>
        <li class="nav-item"><a class="btn btn-dark btn-sm" href="signup.html">Sign up</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <h1 class="h3 fw-semibold mb-3">Login</h1>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a class="small text-decoration-none" href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
          <div class="text-center mt-3">
            <span class="text-muted">No account?</span>
            <a href="signup.html" class="text-decoration-none btn btn-dark">Create one</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</main>

<footer class="py-4 mt-5 border-top">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <div>
      <strong>Nomads</strong>
      <div class="text-muted">Travel blog prototype</div>
    </div>
    <div class="text-muted">
      <a href="about.html" class="text-decoration-none me-3">About</a>
      <a href="contact.html" class="text-decoration-none me-3">Contact</a>
      <a href="signup.html" class="text-decoration-none btn btn-dark">Sign up</a>
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
