  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light fixed-top bg-white shadow-sm" id="mainNav">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="index.html">Nomads</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html">Journal</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="btn btn-outline-dark btn-sm" href="login.html">Login</a></li>
        <li class="nav-item"><a class="btn btn-dark btn-sm" href="signup.html">Sign up</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 fw-semibold mb-3">Sign up</h1>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="firstName">First name</label>
              <input id="firstName" class="form-control" placeholder="Alex" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lastName">Last name</label>
              <input id="lastName" class="form-control" placeholder="Nomad" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="signupEmail">Email</label>
              <input type="email" id="signupEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="signupPassword">Password</label>
              <input type="password" id="signupPassword" class="form-control" placeholder="Create a password" required>
              <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">I agree to the terms</label>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-4">Create account</button>
          <div class="text-center mt-3">
            <span class="text-muted">Already have an account?</span>
            <a href="login.html" class="text-decoration-none">Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</main>

<footer class="py-4 mt-5 border-top">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <div>
      <strong>Nomads</strong>
      <div class="text-muted">Travel blog prototype</div>
    </div>
    <div class="text-muted">
      <a href="about.html" class="text-decoration-none me-3">About</a>
      <a href="contact.html" class="text-decoration-none me-3">Contact</a>
      <a href="signup.html" class="text-decoration-none btn btn-dark">Sign up</a>
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
